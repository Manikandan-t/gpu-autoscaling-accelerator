# Optimized EC2NodeClass: AL2023 with containerd overrides for Spegel P2P
# - use_local_image_pull = true: bypasses transfer service, honors registry mirrors
# - discard_unpacked_layers = false: preserves layers for Spegel to serve to peers
# - config_path for certs.d: enables Spegel registry mirror interception
# - Spegel init container creates mirror config at _default/hosts.toml
# - Do NOT create docker.io/hosts.toml here -- it would override Spegel's mirror
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-nodeclass
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: "KarpenterNodeRole-gpu-accelerator"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "gpu-accelerator"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "gpu-accelerator"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: application/node.eks.aws

    ---
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      containerd:
        config: |
          [plugins."io.containerd.cri.v1.images".registry]
            config_path = "/etc/containerd/certs.d"
          [plugins."io.containerd.cri.v1.images"]
            discard_unpacked_layers = false
    --BOUNDARY--
